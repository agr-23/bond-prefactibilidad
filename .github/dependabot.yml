version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels: [seguridad]
    groups:
      # Menores y parches en un solo PR; las versiones mayores llegan por separado para revisarlas con calma.
      dependencias-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Bogota
    commit-message:
      prefix: ci
    labels: [seguridad]
    groups:
      acciones:
        patterns: ["*"]
